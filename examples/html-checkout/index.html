<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BursaPay Client-Side Checkout Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h2 { margin: 0 0 8px; font-size: 20px; color: #0f172a; }
    p { margin: 0 0 24px; font-size: 14px; color: #64748b; line-height: 1.5; }
    .price {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .footer-note {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">TEST CHECKOUT</div>
    <h2>Pro Developer Annual Pass</h2>
    <p>Get full access to all developer APIs, dedicated virtual accounts, and real-time event webhooks.</p>
    <div class="price">₦25,000<span style="font-size:16px;font-weight:400;color:#64748b;"> / year</span></div>

    <button class="btn" id="payButton" onclick="handlePay()">Pay with BursaPay</button>
    <div class="footer-note">🔒 Secured with BursaPay 256-bit encryption</div>
  </div>

  <script>
    async function handlePay() {
      const btn = document.getElementById('payButton');
      btn.innerText = 'Initializing Checkout...';
      btn.disabled = true;

      try {
        // In production, call your own backend server to create an access_code securely
        // using your Secret Key (bp_sec_live_KEY_HERE). For this demo, we simulate the redirection.
        alert("In a real application, your backend initializes the payment with 'POST /api/v1/payments/initialize/' and redirects the customer to the authorization_url or loads the inline checkout modal.");
      } finally {
        btn.innerText = 'Pay with BursaPay';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
